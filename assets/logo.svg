<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 620" width="512" height="620" role="img" aria-labelledby="t d">
  <title id="t">golden rails</title>
  <desc id="d">A golden rail in cross-section (flat-bottom rail profile) in Art Deco style, with a sunburst on a deep blue badge.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4b0e"/>
      <stop offset="0.20" stop-color="#c8921e"/>
      <stop offset="0.42" stop-color="#ffe9a3"/>
      <stop offset="0.56" stop-color="#f3c447"/>
      <stop offset="0.82" stop-color="#b47b12"/>
      <stop offset="1" stop-color="#5e400b"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#e2ab2f"/>
      <stop offset="1" stop-color="#8a5f12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2b4a73"/>
      <stop offset="1" stop-color="#0c1626"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badge"><rect x="0" y="0" width="512" height="620" rx="56"/></clipPath>
    <path id="rail" d="
      M 199 132 L 313 132 Q 331 132 331 150 L 331 196 Q 331 209 317 213 L 287 223
      Q 274 228 274 245 L 274 368 Q 274 390 297 400 L 386 432 Q 397 436 397 447 L 397 458
      L 115 458 L 115 447 Q 115 436 126 432 L 215 400 Q 238 390 238 368 L 238 245
      Q 238 228 225 223 L 195 213 Q 181 209 181 196 L 181 150 Q 181 132 199 132 Z"/>
    <clipPath id="railclip"><use href="#rail"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="512" height="620" fill="url(#glow)"/>

    <!-- art-deco sunburst behind the rail -->
    <g stroke="#f3c447" stroke-opacity="0.11" stroke-width="10">
      <line x1="256" y1="300" x2="256" y2="-80"/>
      <line x1="256" y1="300" x2="96" y2="-60"/>
      <line x1="256" y1="300" x2="416" y2="-60"/>
      <line x1="256" y1="300" x2="-50" y2="40"/>
      <line x1="256" y1="300" x2="562" y2="40"/>
      <line x1="256" y1="300" x2="-70" y2="210"/>
      <line x1="256" y1="300" x2="582" y2="210"/>
      <line x1="256" y1="300" x2="-70" y2="380"/>
      <line x1="256" y1="300" x2="582" y2="380"/>
    </g>
    <!-- deco frame -->
    <rect x="22" y="22" width="468" height="576" rx="40" fill="none" stroke="#f3c447" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="34" y="34" width="444" height="552" rx="32" fill="none" stroke="#f3c447" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- shadow and sleeper -->
    <ellipse cx="256" cy="472" rx="190" ry="16" fill="url(#shadow)"/>
    <rect x="86" y="458" width="340" height="16" rx="3" fill="#3a3021"/>
    <path d="M86 458 H426" stroke="url(#gold)" stroke-width="2"/>

    <!-- the golden rail (flat-bottom profile) -->
    <use href="#rail" fill="url(#gold)"/>
    <rect x="181" y="132" width="150" height="12" fill="url(#goldV)" opacity="0.65" clip-path="url(#railclip)"/>
    <rect x="80" y="100" width="360" height="380" fill="url(#sheen)" clip-path="url(#railclip)"/>
    <use href="#rail" fill="none" stroke="#5e400b" stroke-width="2.5" stroke-opacity="0.7"/>
    <!-- deco grooves on the web -->
    <g stroke="#7a5410" stroke-opacity="0.55" stroke-width="2">
      <line x1="248" y1="262" x2="248" y2="352"/>
      <line x1="256" y1="256" x2="256" y2="358"/>
      <line x1="264" y1="262" x2="264" y2="352"/>
    </g>

    <!-- wordmark -->
    <text x="256" y="545" text-anchor="middle"
          font-family="'Josefin Sans','Futura','Century Gothic','Avenir Next',sans-serif"
          font-size="42" font-weight="700" letter-spacing="8" fill="url(#gold)">GOLDEN RAILS</text>
  </g>
</svg>
